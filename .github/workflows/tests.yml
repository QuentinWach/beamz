name: Refactor Gate

on:
  push:
    branches: [main, master, refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Ruff + Pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install quality dependencies
        run: uv sync --python 3.11 --extra lint
      - name: Ruff lint
        run: uv run --no-active --python 3.11 ruff check beamz tests examples scripts release_version.py vulture_allowlist.py
      - name: Ruff format
        run: uv run --no-active --python 3.11 ruff format --check beamz tests examples scripts release_version.py vulture_allowlist.py
      - name: Pyright
        run: uv run --no-active --python 3.11 pyright
      - name: Vulture
        run: uv run --no-active --python 3.11 vulture beamz vulture_allowlist.py --min-confidence 60

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install documentation dependencies
        run: uv sync --python 3.11 --extra docs
      - name: Check generated API reference
        run: uv run --no-active --python 3.11 python scripts/update_api_docs.py --check
      - name: Build documentation strictly
        run: uv run --no-active --python 3.11 zensical build --clean
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          if [[ "${{ matrix.python }}" == "3.11" ]]; then
            uv sync --python "${{ matrix.python }}" --extra test --extra gds
          else
            uv sync --python "${{ matrix.python }}" --extra test
          fi
      - name: Run test suite
        if: matrix.python != '3.11'
        run: >-
          uv run --no-active --python ${{ matrix.python }} python -m pytest tests/
          -v --tb=short --durations=50
      - name: Run test suite with coverage
        if: matrix.python == '3.11'
        run: >-
          uv run --no-active --python 3.11 python -m pytest tests/
          -v --tb=short --durations=50
          --cov=beamz --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Upload coverage report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Package build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Seed excluded workspace artifacts
        run: |
          mkdir -p beamz/.cache beamz/.beamz_cache beamz/__pycache__ beamz/site
          touch beamz/.cache/probe beamz/.beamz_cache/probe
          touch beamz/__pycache__/probe.pyc beamz/site/probe
      - name: Build wheel and source distribution
        run: uv build --clear
      - name: Inspect distribution contents
        run: uv run --no-project --python 3.11 python scripts/check_distributions.py
      - name: Install wheel into an isolated environment
        run: |
          uv venv /tmp/beamz-smoke --python 3.11
          uv pip install --python /tmp/beamz-smoke/bin/python dist/*.whl
      - name: Import installed package
        run: /tmp/beamz-smoke/bin/python -c "import beamz; print(beamz.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  refactor-gate:
    name: required / refactor-gate
    if: always()
    needs: [quality, docs, tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every refactor check
        env:
          QUALITY: ${{ needs.quality.result }}
          DOCS: ${{ needs.docs.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$QUALITY" = success
          test "$DOCS" = success
          test "$TESTS" = success
          test "$PACKAGE" = success
