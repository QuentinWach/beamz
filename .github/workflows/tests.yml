name: Tests

on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --all-extras

      - name: Run test suite
        run: >
          uv run --no-active --python 3.11 python -m pytest tests/
          -v
          --tb=short
          --durations=50
          --cov=beamz
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75

      - name: Check generated docs
        run: |
          uv run --no-active --python 3.11 python scripts/update_api_docs.py --check
          uv run --no-active --python 3.11 mkdocs build --strict

      - name: Generate API reference JSON
        run: >
          uv run --no-active --python 3.11 python scripts/update_api_docs.py
          --output-dir "${RUNNER_TEMP}/api-reference"

      - name: Upload API reference JSON
        uses: actions/upload-artifact@v4
        with:
          name: api-reference-json
          path: ${{ runner.temp }}/api-reference/api-reference.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Generate coverage badge
        run: python scripts/update_coverage_badge.py coverage.xml .github/badges/coverage.svg

      - name: Commit coverage badge
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "ci: update coverage badge"
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
