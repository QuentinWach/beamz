name: Trust Gate

on:
  push:
    branches: [main, master, refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Ruff + Pyright + Vulture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install quality dependencies
        run: uv sync --python 3.11 --extra lint
      - name: Ruff lint
        run: uv run --no-active --python 3.11 ruff check beamz tests examples scripts release_version.py vulture_allowlist.py
      - name: Ruff format
        run: uv run --no-active --python 3.11 ruff format --check beamz tests examples scripts release_version.py vulture_allowlist.py
      - name: Pyright
        run: uv run --no-active --python 3.11 pyright
      - name: Vulture
        run: uv run --no-active --python 3.11 vulture beamz vulture_allowlist.py --min-confidence 60

  compatibility:
    name: Compatibility (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Install test dependencies
        run: uv sync --python "${{ matrix.python }}" --extra test
      - name: Run fast contracts and kernels
        run: >-
          uv run --no-active --python ${{ matrix.python }} python -m pytest
          tests/unit tests/contracts tests/kernels
          -v --tb=short --durations=30

  evidence:
    name: Evidence (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install test dependencies
        run: uv sync --python 3.11 --extra test --extra gds
      - name: Run compact evidence suite with branch coverage
        run: >-
          uv run --no-active --python 3.11 python -m pytest tests/
          -m "not slow and not pdk and not hardware"
          -v --tb=short --durations=50
          --cov=beamz --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-report=json:coverage.json --cov-fail-under=80
          --validation-report=validation-results.json
      - name: Enforce risk-weighted coverage floors
        run: >-
          uv run --no-active --python 3.11 python
          scripts/check_coverage_policy.py
          coverage.json tests/coverage_policy.json
      - name: Require 100% changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uv run --no-active --python 3.11 diff-cover coverage.xml
          --compare-branch "origin/${BASE_REF}"
          --fail-under 100
      - name: Render portable validation report
        run: >-
          uv run --no-active --python 3.11 python
          scripts/render_validation_report.py
          validation-results.json validation-report.html
      - name: Upload coverage and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: scientific-evidence
          path: |
            coverage.json
            coverage.xml
            validation-results.json
            validation-report.html

  docs:
    name: Documentation (strict + executable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install documentation dependencies
        run: uv sync --python 3.11 --extra dev --extra test
      - name: Build documentation with warnings as errors
        run: uv run --no-active --python 3.11 mkdocs build --strict
      - name: Execute documentation contracts
        env:
          BEAMZ_DOCS_TEST: "1"
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
        run: >-
          uv run --no-active --python 3.11 python -m pytest tests/docs/
          -m "not slow" -v --tb=short

  package:
    name: Package build and installed-wheel quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Seed excluded workspace artifacts
        run: |
          mkdir -p beamz/.cache beamz/.beamz_cache beamz/__pycache__ beamz/site
          touch beamz/.cache/probe beamz/.beamz_cache/probe
          touch beamz/__pycache__/probe.pyc beamz/site/probe
      - name: Build wheel and source distribution
        run: uv build --clear
      - name: Inspect distribution contents
        run: uv run --no-project --python 3.11 python scripts/check_distributions.py
      - name: Install wheel into an isolated environment
        run: |
          uv venv /tmp/beamz-smoke --python 3.11
          uv pip install --python /tmp/beamz-smoke/bin/python dist/*.whl
      - name: Import installed package
        run: /tmp/beamz-smoke/bin/python -c "import beamz; print(beamz.__version__)"
      - name: Execute quickstart against installed wheel
        env:
          BEAMZ_DOCS_TEST: "1"
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
        run: >-
          /tmp/beamz-smoke/bin/python scripts/execute_markdown_python.py
          docs/getting-started.md
      - name: Execute notebooks against installed wheel
        working-directory: /tmp
        env:
          BEAMZ_DOCS_TEST: "1"
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
        run: |
          for notebook in "$GITHUB_WORKSPACE"/examples/notebooks/*.ipynb; do
            /tmp/beamz-smoke/bin/python \
              "$GITHUB_WORKSPACE/scripts/execute_notebook.py" "$notebook"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  trust-gate:
    name: required / trust-gate
    if: always()
    needs: [quality, compatibility, evidence, docs, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every trust check
        env:
          QUALITY: ${{ needs.quality.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          EVIDENCE: ${{ needs.evidence.result }}
          DOCS: ${{ needs.docs.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$QUALITY" = success
          test "$COMPATIBILITY" = success
          test "$EVIDENCE" = success
          test "$DOCS" = success
          test "$PACKAGE" = success
