name: Native rasterization

on:
  push:
    paths:
      - "beamz/design/raster/**"
      - "rust/**"
      - "tests/unit/raster/**"
      - "tests/integration/test_native_design_rasterization.py"
      - "tests/validation/convergence/test_rasterized_mode_convergence.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
  pull_request:
    paths:
      - "beamz/design/raster/**"
      - "rust/**"
      - "tests/unit/raster/**"
      - "tests/integration/test_native_design_rasterization.py"
      - "tests/validation/convergence/test_rasterized_mode_convergence.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install maturin pytest meshio trimesh "gdsfactory>=8.0"
      - run: maturin build --release --locked --out dist
      - run: python -m pip install dist/beamz-*.whl
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest -q --import-mode=importlib
          "$GITHUB_WORKSPACE/tests/unit/raster"
          "$GITHUB_WORKSPACE/tests/integration/test_native_design_rasterization.py"
          "$GITHUB_WORKSPACE/tests/validation/convergence/test_rasterized_mode_convergence.py"
