[workspace]
members = [
    "rust/fdtd-raster-core",
    "rust/fdtd-raster-py",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beamzorg/beamz"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8"
geo = "0.31"
numpy = "0.29"
parry3d-f64 = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
