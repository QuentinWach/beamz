[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.4",
  "jax==0.6.2; python_version < '3.11'",
  "jax==0.9.0; python_version >= '3.11'",
]
build-backend = "scikit_build_core.build"

[project]
name = "beamz-cuda-component"
version = "0.15.0"
description = "Private optional CUDA component built from the BeamZ source tree"
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "jax==0.6.2; python_version < '3.11'",
  "jax==0.9.0; python_version >= '3.11'",
]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = []
build-dir = "build/{wheel_tag}"
