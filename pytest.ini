[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-config --strict-markers
xfail_strict = true
filterwarnings =
    error
markers =
    optimization: topology-optimization unit and integration tests
    smoke: lightweight execution evidence that does not establish numerical accuracy
    contract: API or behavioral promises (primary evidence class)
    invariant: mathematical or physical identities (primary evidence class)
    validation: agreement with an independent oracle (primary evidence class)
    characterization: measured current behavior without a correctness claim (primary evidence class)
    differential: comparison with an independently implemented solver
    hardware: backend, precision, device, or sharding coverage
    performance: runtime, compilation, memory, or scaling measurement
    docs: executable documentation, notebook, or example coverage
    slow: tests that run longer than typical unit tests but remain pull-request eligible
    release: high-resolution or long-duration tests reserved for the release gate
    unit: legacy execution-scope label; prefer the evidence class for new tests
    component: legacy execution-scope label; prefer the evidence class for new tests
    integration: end-to-end tests spanning multiple subsystems
    compiled: tests that exercise the compiled/JAX execution path
    pdk: tests that depend on external PDK or design-kit availability
    design: marks tests related to design module
    simulation: marks tests related to simulation module
