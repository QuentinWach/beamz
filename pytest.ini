[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
markers =
    slow: expensive tests that still run in the default CI suite
    unit: tests for public API behavior and pure helpers
    component: small real-component tests with limited simulation scope
    integration: end-to-end tests spanning multiple subsystems
    characterization: numerical sweeps and behavior-profiling tests
    compiled: tests that exercise the compiled/JAX execution path
    pdk: tests that depend on external PDK or design-kit availability
    design: marks tests related to design module
    simulation: marks tests related to simulation module
    optimization: marks tests related to optimization module
