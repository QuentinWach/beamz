<header class="md-header beamz-site-header" data-md-component="header">
  <div class="beamz-site-header__inner">
    <a class="beamz-site-header__brand" href="/" aria-label="BEAMZ home">
      <img src="{{ 'assets/BEAMZ_logo_new.svg' | url }}" alt="BEAMZ">
      <span>BEAMZ</span>
    </a>

    <nav class="beamz-site-header__nav" aria-label="Primary navigation">
      <a href="/get-started">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 7v14M3 18a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3H3ZM21 18a1 1 0 0 0 1-1V5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3h6Z"/>
        </svg>
        <span>Get Started</span>
      </a>
      <a href="/docs/api/reference/beamz/" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2Z"/>
          <path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>
        </svg>
        <span>API Docs</span>
      </a>
      <a href="/examples/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/>
        </svg>
        <span>Examples</span>
      </a>
    </nav>

    <div class="beamz-site-header__actions">
      <label class="beamz-site-header__menu" for="__drawer" aria-label="Open documentation navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </label>

      <button
        class="beamz-site-header__theme"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <svg class="beamz-site-header__theme-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a6.8 6.8 0 0 0 9 9A9 9 0 1 1 12 3Z"/>
        </svg>
        <svg class="beamz-site-header__theme-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>

      <a
        class="beamz-site-header__github"
        href="https://github.com/quentinwach/beamz"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open BEAMZ on GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.4 4a5 5 0 0 0-.1-3.5S18.2.1 15 1.8a13.4 13.4 0 0 0-7 0C4.8.1 3.7.5 3.7.5A5 5 0 0 0 3.6 4a5.4 5.4 0 0 0-1.4 3.7c0 5.4 3.5 6.6 6.8 7A4.8 4.8 0 0 0 8 18v4M8 19c-3 .9-3-1.5-4-2"/>
        </svg>
        <span class="beamz-site-header__github-label">GitHub</span>
        <span class="beamz-site-header__github-meta" id="beamz-doc-version">v0.4.3</span>
        <span class="beamz-site-header__github-meta beamz-site-header__stars">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2 2 9.3l6.9-1L12 2Z"/>
          </svg>
          <span id="beamz-doc-stars">54</span>
        </span>
      </a>
    </div>
  </div>
</header>
