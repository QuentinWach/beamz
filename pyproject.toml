[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beamz"
version = "0.4.3"
dynamic = []
authors = [
    { name = "Quentin Wach", email = "quentin.wach+beamz@gmail.com" },
]
description = "Open GPU-accelerated FDTD for photonic chip designers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["computational physics", "electromagnetics", "photonics", "inverse design", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.4",
    "anywidget>=0.9.18",
    "gdspy>=1.6.0",
    "scipy>=1.10.1",
    "shapely>=2.0.6",
    "jax>=0.4.0",
    "gdsfactory",
    "jaxlib>=0.4.0",
    "optax>=0.1.0",
    "micromode>=0.1.0a5",
    "traitlets>=5.14.0",
    "matplotlib>=3.8.0",
    "scikit-image>=0.21.0",
    "xarray>=2024.0.0",
]

[project.urls]
Homepage = "https://github.com/beamzorg/beamz"
Repository = "https://github.com/beamzorg/beamz"
# Bug Tracker, Documentation etc. can be added here

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "myst-parser>=2.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "ruff>=0.14.0",
    "vulture>=2.14",
]
lint = [
    "ruff>=0.14.0",
    "vulture>=2.14",
]
gpu = [
    "torch>=2.6.0",
]
ubc = [
    "ubcpdk==2.7.0",
]
test = [ # Adding a 'test' extra that includes pytest and pytest-cov for convenience
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-randomly>=3.0.0",
]
docs = [
    "griffe>=1.0",
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.26.0",
]


[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"beamz/**/__init__.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["beamz"]
include = [
    "beamz/visual/scene/static/*",
]
