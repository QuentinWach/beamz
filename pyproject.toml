[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beamz"
version = "0.4.3"
dynamic = []
authors = [
    { name = "Quentin Wach", email = "quentin.wach+beamz@gmail.com" },
]
description = "Open GPU-accelerated FDTD for photonic chip designers."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
keywords = ["computational physics", "electromagnetics", "photonics", "inverse design", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    "shapely>=2.0.6",
    "jax>=0.4.0",
    "optax>=0.1.0",
    "micromode>=0.1.0a6",
    "matplotlib>=3.8.0",
    "scikit-image>=0.21.0",
    "xarray>=2024.0.0",
]

[project.urls]
Homepage = "https://github.com/beamzorg/beamz"
Repository = "https://github.com/beamzorg/beamz"
# Bug Tracker, Documentation etc. can be added here

[project.optional-dependencies]
gds = [
    "gdsfactory>=8.0; python_version < '3.14'",
    "gdsfactory>=9.0; python_version >= '3.14'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "myst-parser>=2.0.0",
    "zensical>=0.0.15",
    "griffe>=1.0",
    "mkdocstrings[python]>=0.26.0",
    "pyright>=1.1.400",
    "ruff>=0.14.0",
    "vulture>=2.14",
]
lint = [
    "pyright>=1.1.400",
    "ruff>=0.14.0",
    "vulture>=2.14",
]
ubc = [
    "gdsfactory>=8.0; python_version < '3.14'",
    "gdsfactory>=9.0; python_version >= '3.14'",
    "ubcpdk==2.7.0; python_version < '3.14'",
]
test = [ # Adding a 'test' extra that includes pytest and pytest-cov for convenience
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-randomly>=3.0.0",
]
docs = [
    "griffe>=1.0",
    "zensical>=0.0.15",
    "mkdocstrings[python]>=0.26.0",
]


[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90", "SIM"]

[tool.ruff.lint.per-file-ignores]
"beamz/**/__init__.py" = ["F401"]
"vulture_allowlist.py" = ["B018", "F821"]

[tool.pyright]
include = ["beamz"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingTypeStubs = false
strict = [
    "beamz/devices/ports.py",
]

[tool.ruff.lint.mccabe]
max-complexity = 35

[tool.hatch.build]
ignore-vcs = true
exclude = [
    "**/.cache",
    "**/.beamz_cache",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.mypy_cache",
    "**/.ipynb_checkpoints",
    "**/.tox",
    "**/.venv",
    "**/*.egg-info",
    "**/*.py[cod]",
    "**/.coverage*",
    "**/.DS_Store",
    "**/coverage.xml",
    "**/htmlcov",
    "**/site",
    "**/build",
    "**/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["beamz"]
include = [
    "beamz/py.typed",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "beamz",
]
