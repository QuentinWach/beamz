[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zview"
version = "0.1.0"
description = "Three.js + anywidget 3D visualization for BeamZ designs and simulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Quentin Wach" },
]
dependencies = [
  "traitlets>=5.14.0",
]

[project.optional-dependencies]
widget = [
  "anywidget>=0.9.18",
]
dev = [
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zview"]
include = [
  "src/zview/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
